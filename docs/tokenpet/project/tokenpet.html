<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>glorp — your CLI companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: oklch(0.18 0.005 60);
    --surface: oklch(0.22 0.006 60);
    --fg: oklch(0.94 0.01 80);
    --dim: oklch(0.66 0.012 70);
    --faint: oklch(0.42 0.008 60);
    --accent: oklch(0.78 0.14 70);
    --good: oklch(0.74 0.10 145);
    --bad: oklch(0.68 0.16 25);
    --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: var(--mono);
    background: radial-gradient(ellipse at 30% 0%, oklch(0.22 0.01 60) 0%, oklch(0.13 0.005 60) 70%);
    color: var(--fg);
    font-size: 14px;
    line-height: 1.45;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 32px 16px;
  }
  body.crt {
    background: radial-gradient(ellipse at 50% 50%, var(--bg) 0%, #000 90%);
  }
  body.crt::after {
    content: '';
    position: fixed; inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.02) 0px,
      rgba(255,255,255,0.02) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index: 999;
  }

  .screen {
    width: 100%;
    max-width: 1180px;
    display: flex;
    justify-content: center;
  }

  /* ── terminal window ─────────────────────────────────────── */
  .terminal {
    width: 100%;
    background: var(--bg);
    border-radius: 10px;
    overflow: hidden;
    box-shadow:
      0 0 0 1px oklch(0.30 0.008 60 / 0.4),
      0 30px 80px -20px rgba(0,0,0,0.7),
      0 8px 24px rgba(0,0,0,0.4);
  }
  .chrome {
    display: flex;
    align-items: center;
    padding: 10px 14px;
    background: linear-gradient(to bottom, oklch(0.26 0.008 60), oklch(0.22 0.006 60));
    border-bottom: 1px solid oklch(0.30 0.008 60 / 0.5);
  }
  .chrome-buttons { display: flex; gap: 8px; }
  .cb {
    width: 12px; height: 12px; border-radius: 50%;
    background: #555;
  }
  .cb.red { background: #ff5f57; }
  .cb.yel { background: #febc2e; }
  .cb.grn { background: #28c840; }
  .chrome-title {
    flex: 1;
    text-align: center;
    color: var(--dim);
    font-size: 12px;
    letter-spacing: 0.02em;
  }
  .chrome-spacer { width: 52px; }

  .body {
    padding: 18px 22px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .columns {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr);
    gap: 24px;
    align-items: start;
  }
  .col {
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-width: 0;
  }
  .col-divider {
    border-left: 1px dashed oklch(0.42 0.008 60 / 0.5);
    margin: 0 -12px;
  }
  @media (max-width: 760px) {
    .columns { grid-template-columns: 1fr; }
    .col-divider { display: none; }
  }

  /* ── prompt line ─────────────────────────────────────────── */
  .cmdline-prompt {
    color: var(--dim);
    font-size: 13px;
  }
  .prompt-user { color: var(--good); font-weight: 500; }
  .prompt-path { color: var(--accent); }
  .prompt-sep { color: var(--faint); margin: 0 2px; }
  .prompt-typed { color: var(--fg); }

  /* ── pet display ─────────────────────────────────────────── */
  .pet-stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 0 16px;
    gap: 14px;
  }
  .pet {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1.05;
  }
  .pet-frame {
    margin: 0;
    font-family: var(--mono);
    font-size: 22px;
    line-height: 1.05;
    color: var(--fg);
    white-space: pre;
    text-align: center;
    transition: color 0.4s ease;
  }
  .mood-happy .pet-frame, .mood-ecstatic .pet-frame {
    color: var(--accent);
    text-shadow: 0 0 8px oklch(0.78 0.14 70 / 0.4);
  }
  .mood-hungry .pet-frame, .mood-sad .pet-frame {
    color: var(--dim);
  }
  .mood-sleepy .pet-frame {
    color: var(--dim);
    opacity: 0.75;
  }
  /* Wilted = neglected. Faded, drooped, slow. Not death — just visibly hurt. */
  .mood-wilted .pet-frame {
    filter: saturate(0.35) brightness(0.78);
    opacity: 0.62;
    animation: wilt-droop 5s ease-in-out infinite;
  }
  @keyframes wilt-droop {
    0%, 100% { transform: translateY(2px); }
    50%      { transform: translateY(4px); }
  }
  .mood-wilted .pl { opacity: 0.3; }
  /* Sage shimmer */
  .pet-sage .pet-frame {
    animation: shimmer 3s ease-in-out infinite;
  }
  @keyframes shimmer {
    0%, 100% { filter: drop-shadow(0 0 4px oklch(0.78 0.14 70 / 0.3)); }
    50%      { filter: drop-shadow(0 0 12px oklch(0.78 0.14 70 / 0.6)); }
  }
  .bubble {
    margin: 0 0 4px;
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.05;
    color: var(--accent);
    white-space: pre;
    align-self: flex-start;
    animation: bubble-pop 0.2s ease-out;
  }
  @keyframes bubble-pop {
    from { transform: scale(0.85) translateY(4px); opacity: 0; }
    to   { transform: scale(1) translateY(0); opacity: 1; }
  }

  .pet-meta {
    display: flex;
    gap: 8px;
    font-size: 12px;
    color: var(--dim);
    align-items: baseline;
  }
  .pet-name { color: var(--fg); font-weight: 500; }
  .pet-stage-tag { color: var(--accent); }
  .pet-sep { color: var(--faint); }
  .pet-mood { color: var(--good); }
  .pet-mood.mood-hungry, .pet-mood.mood-sad, .pet-mood.mood-sleepy { color: var(--bad); }
  .pet-mood.mood-ecstatic { color: var(--accent); font-weight: 500; }

  /* ── sections ────────────────────────────────────────────── */
  .section {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .section-header {
    color: var(--faint);
    font-size: 12px;
    letter-spacing: 0.02em;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
  }

  /* ── stat rows ───────────────────────────────────────────── */
  .stat-row {
    display: grid;
    grid-template-columns: 18px 70px 1fr auto;
    gap: 10px;
    align-items: baseline;
    font-size: 13px;
  }
  .stat-icon { color: var(--accent); text-align: center; }
  .stat-label { color: var(--dim); }
  .bar {
    font-family: var(--mono);
    letter-spacing: -1px;
    line-height: 1;
  }
  .bar-empty { color: var(--faint); }
  .stat-value { color: var(--fg); font-variant-numeric: tabular-nums; min-width: 4ch; text-align: right; }
  .stat-suffix { color: var(--dim); }
  .stat-xp .stat-value { min-width: 0; }
  .xp-value { color: var(--dim); font-size: 12px; }

  /* ── today grid ──────────────────────────────────────────── */
  .today-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px 24px;
    padding: 4px 0;
  }
  .today-cell {
    display: grid;
    grid-template-columns: 70px 1fr;
    grid-template-rows: auto auto;
    column-gap: 12px;
    align-items: baseline;
  }
  .today-label { color: var(--dim); font-size: 12px; grid-row: 1; }
  .today-value { color: var(--fg); font-weight: 500; font-variant-numeric: tabular-nums; grid-row: 1; }
  .today-delta { color: var(--faint); font-size: 11px; grid-column: 2; grid-row: 2; }
  .today-delta.up { color: var(--good); }
  .today-delta.down { color: var(--bad); }
  .good { color: var(--good); }
  .bad { color: var(--bad); }

  /* ── log ─────────────────────────────────────────────────── */
  .log-section { gap: 4px; }
  .log {
    height: 230px;
    overflow-y: auto;
    font-size: 13px;
    padding: 4px 0;
    scrollbar-width: thin;
    scrollbar-color: var(--faint) transparent;
  }
  .log::-webkit-scrollbar { width: 6px; }
  .log::-webkit-scrollbar-thumb { background: var(--faint); border-radius: 3px; }
  .log-entry {
    display: grid;
    grid-template-columns: 50px 1fr;
    gap: 10px;
    padding: 1px 0;
  }
  .log-time { color: var(--faint); font-variant-numeric: tabular-nums; font-size: 12px; }
  .log-text { color: var(--dim); }
  .log-feed .log-text { color: var(--good); }
  .log-ship .log-text { color: var(--accent); font-weight: 500; }
  .log-warn .log-text { color: var(--bad); }
  .log-err  .log-text { color: var(--bad); }
  .log-cmd  .log-text { color: var(--fg); }
  .log-help .log-text { color: var(--dim); }
  .log-level .log-text {
    color: var(--accent);
    font-weight: 500;
    text-shadow: 0 0 8px oklch(0.78 0.14 70 / 0.5);
  }
  .log-prompt .log-text { color: var(--fg); display: flex; align-items: center; gap: 6px; }

  .cmd-input {
    flex: 1;
    background: transparent;
    border: 0;
    outline: 0;
    color: var(--fg);
    font: inherit;
    font-family: var(--mono);
    padding: 0;
    caret-color: var(--accent);
  }
  .cmd-input::placeholder { color: var(--faint); font-style: italic; }
  .caret {
    color: var(--accent);
    animation: blink 1s steps(2, end) infinite;
    margin-left: -4px;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ── cinematic evolution overlay ─────────────────────────── */
  .evo-overlay {
    position: absolute;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: oklch(0.12 0.005 60 / 0.78);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: evo-fade 0.4s ease-out;
    pointer-events: none;
  }
  @keyframes evo-fade { from { opacity: 0; } to { opacity: 1; } }
  .evo-card {
    font-family: var(--mono);
    color: var(--fg);
    text-align: center;
    padding: 32px 56px;
    border: 1px solid var(--accent);
    background: oklch(0.18 0.005 60 / 0.92);
    box-shadow: 0 0 60px oklch(0.78 0.14 70 / 0.35), inset 0 0 30px oklch(0.78 0.14 70 / 0.05);
    animation: evo-pop 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2);
  }
  @keyframes evo-pop {
    from { transform: scale(0.85); opacity: 0; }
    to   { transform: scale(1);     opacity: 1; }
  }
  .evo-stars {
    color: var(--accent);
    font-size: 13px;
    letter-spacing: 0.12em;
    opacity: 0.7;
    animation: evo-twinkle 1.4s ease-in-out infinite;
  }
  @keyframes evo-twinkle {
    0%, 100% { opacity: 0.4; }
    50%      { opacity: 0.9; }
  }
  .evo-headline {
    margin: 14px 0 4px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .evo-pulse {
    color: var(--accent);
    animation: evo-pulse 0.8s ease-in-out infinite alternate;
  }
  @keyframes evo-pulse {
    from { text-shadow: 0 0 6px oklch(0.78 0.14 70 / 0.4); }
    to   { text-shadow: 0 0 18px oklch(0.78 0.14 70 / 0.9); }
  }
  .evo-evolved { color: var(--fg); }
  .evo-pets {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
    margin: 18px 0;
  }
  .evo-pet { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .evo-art {
    margin: 0;
    line-height: 1.05;
    font-size: 16px;
    white-space: pre;
    text-align: center;
  }
  .evo-pet-new .evo-art {
    filter: drop-shadow(0 0 12px oklch(0.78 0.14 70 / 0.55));
    animation: evo-glow 1.6s ease-in-out infinite;
  }
  @keyframes evo-glow {
    0%, 100% { filter: drop-shadow(0 0 6px  oklch(0.78 0.14 70 / 0.35)); }
    50%      { filter: drop-shadow(0 0 18px oklch(0.78 0.14 70 / 0.85)); }
  }
  .evo-stage-name {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: oklch(0.65 0.01 80);
  }
  .evo-stage-new { color: var(--accent); font-weight: 700; }
  .evo-arrow {
    color: var(--accent);
    font-size: 18px;
    letter-spacing: -0.05em;
    animation: evo-arrow 1.2s ease-in-out infinite;
  }
  @keyframes evo-arrow {
    0%, 100% { transform: translateX(-2px); opacity: 0.5; }
    50%      { transform: translateX( 4px); opacity: 1; }
  }
  .evo-sub {
    margin-top: 10px;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: oklch(0.6 0.01 80);
  }
  .evo-sub b { color: var(--accent); font-weight: 700; }

  /* ── per-species particle/aura layers ────────────────────── */
  .pet-aura {
    position: relative;
    display: inline-block;
  }
  .pl {
    position: absolute;
    inset: 0;
    pointer-events: none;
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.05;
  }
  .pl > * {
    position: absolute;
    display: inline-block;
    will-change: transform, opacity;
  }

  /* fuzz — tail flick at the bottom-right */
  .pl-fuzz .pl-tail {
    bottom: 8px;
    right: -8px;
    color: var(--accent);
    opacity: 0.6;
    transition: transform 0.18s ease;
  }
  .pl-fuzz .pl-tail.swish { transform: translateX(4px) rotate(-12deg); }

  /* blob — slow drips below */
  .pl-blob .pl-drop {
    bottom: -2px;
    color: var(--accent);
    opacity: 0.55;
    animation: drip 2.4s ease-in infinite;
  }
  .pl-blob .pl-drop-1 { left: 18%; animation-delay: 0s; }
  .pl-blob .pl-drop-2 { left: 50%; animation-delay: 0.7s; }
  .pl-blob .pl-drop-3 { left: 78%; animation-delay: 1.4s; }
  @keyframes drip {
    0%        { transform: translateY(-6px); opacity: 0; }
    20%       { opacity: 0.7; }
    100%      { transform: translateY(14px); opacity: 0; }
  }

  /* ghost — wisps drifting upward, base float on whole pet */
  .pet-ghost .pet-frame { animation: ghost-float 3.2s ease-in-out infinite; }
  @keyframes ghost-float {
    0%, 100% { transform: translateY(0); opacity: 0.92; }
    50%      { transform: translateY(-2px); opacity: 1; }
  }
  .pl-ghost .pl-wisp {
    color: oklch(0.85 0.04 80);
    opacity: 0.5;
    animation: wisp-drift 3.6s ease-out infinite;
  }
  .pl-ghost .pl-wisp-1 { left: 12%; top: 60%; animation-delay: 0s; }
  .pl-ghost .pl-wisp-2 { left: 30%; top: 70%; animation-delay: 0.9s; }
  .pl-ghost .pl-wisp-3 { left: 70%; top: 65%; animation-delay: 1.6s; }
  .pl-ghost .pl-wisp-4 { left: 88%; top: 75%; animation-delay: 2.4s; }
  @keyframes wisp-drift {
    0%   { transform: translate(0, 8px) scale(1);   opacity: 0; }
    30%  { opacity: 0.6; }
    100% { transform: translate(-6px, -28px) scale(0.6); opacity: 0; }
  }

  /* glitch — scanline + flickering noise */
  .pl-glitch .pl-scan {
    position: absolute;
    left: -8px; right: -8px;
    height: 2px;
    background: oklch(0.78 0.14 70 / 0.35);
    box-shadow: 0 0 6px oklch(0.78 0.14 70 / 0.5);
    animation: scan 2.8s linear infinite;
  }
  @keyframes scan {
    0%   { top: 0%;   opacity: 0; }
    10%  { opacity: 0.8; }
    90%  { opacity: 0.8; }
    100% { top: 100%; opacity: 0; }
  }
  .pl-glitch .pl-noise {
    color: oklch(0.78 0.14 70);
    opacity: 0;
    animation: noise-flick 1.4s steps(1) infinite;
    text-shadow: 0 0 4px oklch(0.78 0.14 70 / 0.6);
  }
  .pl-glitch .pl-noise-1 { top: 18%; left: -6px; animation-delay: 0s; }
  .pl-glitch .pl-noise-2 { top: 52%; right: -6px; animation-delay: 0.5s; }
  .pl-glitch .pl-noise-3 { top: 75%; left: -8px; animation-delay: 1.0s; }
  @keyframes noise-flick {
    0%, 95% { opacity: 0; }
    96%, 99% { opacity: 0.9; }
  }

  /* crystal — sparkle constellation around pet */
  .pet-crystal .pet-frame {
    animation: crystal-shimmer 4s ease-in-out infinite;
    filter: drop-shadow(0 0 6px oklch(0.78 0.14 70 / 0.25));
  }
  @keyframes crystal-shimmer {
    0%, 100% { filter: drop-shadow(0 0 4px oklch(0.78 0.14 70 / 0.2));  }
    50%      { filter: drop-shadow(0 0 16px oklch(0.78 0.14 70 / 0.7)); }
  }
  .pl-crystal .pl-spark {
    color: var(--accent);
    opacity: 0;
    animation: spark 2.6s ease-in-out infinite;
    text-shadow: 0 0 4px oklch(0.78 0.14 70 / 0.7);
  }
  .pl-crystal .pl-spark-1 { top: 8%;  left: -4px;  animation-delay: 0s;   }
  .pl-crystal .pl-spark-2 { top: 28%; right: -4px; animation-delay: 0.5s; }
  .pl-crystal .pl-spark-3 { top: 60%; left: -8px;  animation-delay: 1.1s; }
  .pl-crystal .pl-spark-4 { top: 80%; right: -2px; animation-delay: 1.6s; }
  .pl-crystal .pl-spark-5 { top: 40%; left: 50%;   animation-delay: 2.0s; }
  @keyframes spark {
    0%, 100% { opacity: 0; transform: scale(0.7); }
    50%      { opacity: 1; transform: scale(1.1); }
  }

  /* mech — antenna LED + steam puffs */
  .pl-mech .pl-led {
    top: -4px; left: 50%;
    transform: translateX(-50%);
    color: oklch(0.78 0.14 70);
    font-size: 10px;
    transition: opacity 0.12s linear;
    text-shadow: 0 0 4px oklch(0.78 0.14 70 / 0.7);
  }
  .pl-mech .pl-led.off { opacity: 0.2; text-shadow: none; }
  .pl-mech .pl-led.on  { opacity: 1;   }
  .pl-mech .pl-steam {
    color: oklch(0.7 0.005 60);
    opacity: 0;
    animation: steam 3.8s ease-out infinite;
  }
  .pl-mech .pl-steam-1 { right: 0%;  top: 30%; animation-delay: 0.4s; }
  .pl-mech .pl-steam-2 { left: -2px; top: 50%; animation-delay: 2.0s; }
  @keyframes steam {
    0%   { transform: translateY(0)   scale(1);   opacity: 0; }
    20%  { opacity: 0.7; }
    100% { transform: translateY(-18px) scale(0.4); opacity: 0; }
  }

  /* ── action buttons ──────────────────────────────────────── */
  .actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding-top: 4px;
  }
  .actions button {
    appearance: none;
    background: transparent;
    color: var(--accent);
    border: 1px solid oklch(0.78 0.14 70 / 0.3);
    border-radius: 4px;
    padding: 5px 14px;
    font: inherit;
    font-family: var(--mono);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.12s ease;
  }
  .actions button:hover {
    background: oklch(0.78 0.14 70 / 0.12);
    border-color: var(--accent);
  }
  .actions button:active { transform: translateY(1px); }
  .actions button.ghost { color: var(--dim); border-color: oklch(0.66 0.012 70 / 0.25); }
  .actions button.ghost:hover { color: var(--fg); border-color: var(--dim); background: oklch(0.66 0.012 70 / 0.08); }

  /* ── litter gallery ──────────────────────────────────────── */
  .litter { display: flex; flex-direction: column; gap: 6px; }
  .litter-row {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 6px 2px 8px;
    scrollbar-width: thin;
    scrollbar-color: var(--faint) transparent;
  }
  .litter-row::-webkit-scrollbar { height: 6px; }
  .litter-row::-webkit-scrollbar-thumb { background: var(--faint); border-radius: 3px; }
  .mini-card {
    flex: 0 0 auto;
    appearance: none;
    background: oklch(0.22 0.006 60 / 0.5);
    border: 1px dashed oklch(0.42 0.008 60 / 0.55);
    border-radius: 6px;
    padding: 8px 10px 6px;
    cursor: pointer;
    font: inherit;
    color: inherit;
    transition: all 0.15s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .mini-card:hover {
    border-color: var(--accent);
    background: oklch(0.78 0.14 70 / 0.07);
    transform: translateY(-1px);
  }
  .mini-card.active {
    border-style: solid;
    border-color: var(--accent);
    box-shadow: inset 0 0 0 1px oklch(0.78 0.14 70 / 0.4),
                0 0 0 3px oklch(0.78 0.14 70 / 0.10);
  }
  .mini-pet { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .mini-frame {
    margin: 0;
    font-family: var(--mono);
    font-size: 9px;
    line-height: 1.05;
    white-space: pre;
    text-align: center;
    color: var(--fg);
  }
  .mini-meta {
    display: flex;
    flex-direction: column;
    align-items: center;
    font-size: 10px;
    line-height: 1.2;
  }
  .mini-name { color: var(--fg); }
  .mini-species { color: var(--dim); font-size: 9px; }
  body.crt .mini-card { background: transparent; }
  body.crt .terminal {
    box-shadow:
      0 0 0 1px var(--accent),
      0 0 60px oklch(0.78 0.14 70 / 0.15),
      0 30px 80px -20px rgba(0,0,0,0.9);
  }

  /* ── hint strip ───────────────────────────────────────── */
  .hint-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    padding: 8px 2px 0;
    border-top: 1px dashed oklch(0.42 0.008 60 / 0.4);
    margin-top: 4px;
    font-size: 11px;
    color: var(--faint);
    letter-spacing: 0.02em;
    align-items: center;
  }
  .hint-strip .hint-key { color: var(--dim); }
  .hint-strip kbd {
    font-family: var(--mono);
    background: oklch(0.30 0.008 60 / 0.5);
    border: 1px solid oklch(0.42 0.008 60 / 0.5);
    border-radius: 3px;
    padding: 0 5px;
    font-size: 10px;
    color: var(--fg);
    margin: 0 1px;
  }

  /* ── toast stack (achievements) ─────────────────────── */
  .toast-stack {
    position: fixed;
    top: 24px;
    right: 24px;
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 10px;
    pointer-events: none;
  }
  .toast {
    font-family: var(--mono);
    background: oklch(0.18 0.005 60 / 0.96);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 10px 16px 11px;
    color: var(--fg);
    box-shadow: 0 8px 28px rgba(0,0,0,0.6), 0 0 24px oklch(0.78 0.14 70 / 0.25);
    animation: toast-in 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2);
    max-width: 320px;
  }
  .toast.exit { animation: toast-out 0.4s ease forwards; }
  @keyframes toast-in {
    from { transform: translateX(40px); opacity: 0; }
    to   { transform: translateX(0);    opacity: 1; }
  }
  @keyframes toast-out {
    to { transform: translateX(20px); opacity: 0; }
  }
  .toast-title {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--accent);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .toast-name { font-size: 14px; color: var(--fg); margin: 5px 0 2px; }
  .toast-desc { font-size: 11px; color: var(--dim); }

  /* ── bell flash ──────────────────────────────────────── */
  .terminal.bell-flash { animation: bell-flash 0.55s ease; }
  @keyframes bell-flash {
    0%, 100% {
      box-shadow:
        0 0 0 1px oklch(0.30 0.008 60 / 0.4),
        0 30px 80px -20px rgba(0,0,0,0.7),
        0 8px 24px rgba(0,0,0,0.4);
    }
    25% {
      box-shadow:
        0 0 0 2px var(--accent),
        0 0 60px oklch(0.78 0.14 70 / 0.55),
        0 30px 80px -20px rgba(0,0,0,0.7);
    }
  }

  /* ── sparkline ────────────────────────────────────────── */
  .sparkline {
    display: inline-flex;
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0;
    color: var(--accent);
    line-height: 1;
  }
  .sparkline .spark-day { color: var(--accent); opacity: 0.6; }
  .sparkline .spark-day.today {
    color: var(--fg);
    opacity: 1;
    text-shadow: 0 0 6px oklch(0.78 0.14 70 / 0.6);
  }
  .spark-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 10px;
    color: var(--faint);
    margin-top: 3px;
  }

  /* ── onboarding overlay ────────────────────────────── */
  .onboarding {
    position: fixed;
    inset: 0;
    z-index: 220;
    background: oklch(0.10 0.005 60 / 0.96);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    animation: evo-fade 0.3s ease;
  }
  .onboarding-card {
    width: min(640px, 92vw);
    background: var(--bg);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 22px 28px 20px;
    box-shadow: 0 0 60px oklch(0.78 0.14 70 / 0.25);
  }
  .install-stream {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--dim);
    white-space: pre;
    min-height: 280px;
    max-height: 360px;
    overflow: hidden;
    line-height: 1.5;
  }
  .install-stream .il-cmd  { color: var(--fg); }
  .install-stream .il-ok   { color: var(--good); }
  .install-stream .il-warn { color: var(--accent); }
  .install-stream .il-info { color: var(--dim); }
  .install-stream .il-egg  { color: var(--accent); }
  .onboarding-actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    justify-content: flex-end;
  }
  .onboarding-actions button {
    appearance: none;
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 6px 14px;
    font: inherit;
    font-family: var(--mono);
    font-size: 12px;
    cursor: pointer;
  }
  .onboarding-actions button.ghost {
    color: var(--dim);
    border-color: var(--faint);
  }
  .onboarding-actions button:hover { background: oklch(0.78 0.14 70 / 0.15); }
  .onboarding-name-input {
    width: 100%;
    background: transparent;
    border: 0;
    border-bottom: 1px dashed var(--dim);
    outline: 0;
    color: var(--fg);
    font: inherit;
    font-family: var(--mono);
    font-size: 22px;
    padding: 6px 0;
    margin: 12px 0 4px;
    caret-color: var(--accent);
    text-align: center;
  }
  .onboarding-name-hint {
    color: var(--faint);
    font-size: 11px;
    text-align: center;
  }
  .onboarding-name-hint code {
    color: var(--accent);
    background: oklch(0.30 0.008 60 / 0.4);
    padding: 1px 5px;
    border-radius: 2px;
  }
  .onboarding-egg {
    font-family: var(--mono);
    white-space: pre;
    font-size: 26px;
    line-height: 1.1;
    text-align: center;
    color: var(--accent);
    padding: 18px 0 12px;
    animation: egg-wobble 1.6s ease-in-out infinite;
    text-shadow: 0 0 12px oklch(0.78 0.14 70 / 0.4);
  }
  @keyframes egg-wobble {
    0%, 100% { transform: rotate(-2deg) translateY(0); }
    50%      { transform: rotate(2deg)  translateY(-3px); }
  }
  .onboarding-egg.cracking {
    animation: egg-crack 0.9s ease-in-out forwards;
  }
  @keyframes egg-crack {
    0% { transform: scale(1) rotate(0); }
    20% { transform: scale(1.06) rotate(-6deg); }
    40% { transform: scale(1.10) rotate(6deg); }
    60% { transform: scale(1.12) rotate(-8deg); filter: brightness(1.5); }
    100% { transform: scale(0.6); opacity: 0; filter: brightness(2); }
  }

  /* ── death + graveyard ──────────────────────────────── */
  .mood-dead .pet-frame {
    filter: saturate(0) brightness(0.55);
    opacity: 0.4;
  }
  .mood-dead .pl > * { display: none; }
  .death-overlay {
    position: absolute;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: oklch(0.10 0.005 60 / 0.85);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    font-family: var(--mono);
    animation: evo-fade 0.4s ease;
  }
  .rip-card {
    width: min(380px, 85%);
    border: 1px solid oklch(0.42 0.008 60 / 0.7);
    background: oklch(0.18 0.005 60 / 0.96);
    padding: 22px 28px 20px;
    text-align: center;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
  }
  .rip-headline {
    color: var(--bad);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .rip-stone {
    font-family: var(--mono);
    white-space: pre;
    color: var(--dim);
    font-size: 13px;
    margin: 4px 0 14px;
    line-height: 1.1;
  }
  .rip-revive {
    appearance: none;
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 7px 18px;
    font-family: var(--mono);
    font-size: 12px;
    cursor: pointer;
    margin-top: 8px;
  }
  .rip-revive:hover { background: oklch(0.78 0.14 70 / 0.15); }

  .graveyard-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 12px;
    color: var(--dim);
  }
  .graveyard-row {
    display: grid;
    grid-template-columns: 18px 1fr auto auto;
    gap: 8px;
    padding: 4px 8px;
    border: 1px dashed oklch(0.42 0.008 60 / 0.45);
    border-radius: 3px;
    align-items: baseline;
  }
  .graveyard-row .gy-glyph { color: var(--faint); }
  .graveyard-row .gy-name { color: var(--fg); }
  .graveyard-row .gy-cause { color: var(--bad); font-size: 11px; }
  .graveyard-row .gy-age { color: var(--faint); font-size: 11px; }

  /* ── help palette ─────────────────────────────────────── */
  .help-palette {
    position: fixed;
    inset: 0;
    z-index: 210;
    background: oklch(0.10 0.005 60 / 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(2px);
    font-family: var(--mono);
    animation: evo-fade 0.2s ease;
  }
  .help-card {
    width: min(620px, 92vw);
    background: var(--bg);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 18px 22px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  .help-title {
    color: var(--accent);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .help-grid {
    display: grid;
    grid-template-columns: 140px 1fr;
    row-gap: 5px;
    column-gap: 18px;
    font-size: 13px;
  }
  .help-grid .hk { color: var(--fg); }
  .help-grid .hd { color: var(--dim); }
  .help-close { color: var(--faint); font-size: 11px; margin-top: 12px; text-align: right; }

  /* ── activity feed grouping ────────────────────────── */
  .log-info .log-text { color: var(--faint); font-style: italic; }
  .log-divider { padding: 0; }
  .log-divider .log-time { visibility: hidden; }
  .log-divider .log-text {
    height: 1px;
    background: linear-gradient(to right, transparent, oklch(0.42 0.008 60 / 0.4), transparent);
    margin: 6px 0 6px;
  }
  .log-cmd, .log-feed, .log-ship, .log-level, .log-warn, .log-err, .log-treat, .log-achv {
    border-left: 2px solid oklch(0.78 0.14 70 / 0.18);
    padding-left: 6px;
    margin-left: -8px;
  }
  .log-cmd { border-left-color: oklch(0.78 0.14 70 / 0.4); }
  .log-ship { border-left-color: var(--accent); }
  .log-feed { border-left-color: oklch(0.74 0.10 145 / 0.55); }
  .log-treat { border-left-color: oklch(0.74 0.10 145 / 0.55); }
  .log-treat .log-text { color: var(--good); }
  .log-level { border-left-color: var(--accent); }
  .log-achv { border-left-color: var(--accent); }
  .log-achv .log-text {
    color: var(--accent);
    font-weight: 500;
    text-shadow: 0 0 8px oklch(0.78 0.14 70 / 0.5);
  }
  .log-warn, .log-err { border-left-color: oklch(0.68 0.16 25 / 0.5); }

  /* ── treat menu ───────────────────────────────────────── */
  .treat-menu {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 4px 0 0;
  }
  .treat-menu button {
    appearance: none;
    background: transparent;
    border: 1px dashed oklch(0.42 0.008 60 / 0.55);
    border-radius: 4px;
    padding: 4px 10px;
    font: inherit;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--dim);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all 0.12s ease;
  }
  .treat-menu button:hover {
    border-color: var(--accent);
    border-style: solid;
    color: var(--fg);
    background: oklch(0.78 0.14 70 / 0.06);
  }
  .treat-menu .treat-glyph { color: var(--accent); }

  /* ── collapsible tweaks section ──────────────────────── */
  .tw-collapsible.collapsed > .tw-section-head [class*="section-content"],
  .tw-collapsible.collapsed > .tw-section-head > div > div:not(:first-child) {
    display: none !important;
  }
  .tw-section-head {
    cursor: pointer;
    user-select: none;
  }
  .tw-section-head > div { position: relative; }
  .tw-section-head > div::before {
    content: '▾';
    position: absolute;
    left: -14px;
    top: 2px;
    color: var(--accent);
    font-size: 11px;
    transition: transform 0.15s ease;
  }
  .tw-section-head.collapsed > div::before {
    transform: rotate(-90deg);
  }

  /* ── achievements list ──────────────────────────────── */
  .achv-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 6px;
    padding: 4px 0;
  }
  .achv-row {
    display: grid;
    grid-template-columns: 18px 1fr;
    gap: 8px;
    padding: 5px 8px;
    border: 1px dashed oklch(0.42 0.008 60 / 0.4);
    border-radius: 3px;
    font-size: 11px;
    align-items: baseline;
  }
  .achv-row.locked { opacity: 0.45; }
  .achv-row .ag { color: var(--accent); }
  .achv-row.locked .ag { color: var(--faint); }
  .achv-row .at { color: var(--fg); display: block; }
  .achv-row.locked .at { color: var(--dim); }
  .achv-row .ad { color: var(--dim); display: block; font-size: 10px; }
  .achv-row.locked .ad { color: var(--faint); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="pet.jsx"></script>
<script type="text/babel" src="extras.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
