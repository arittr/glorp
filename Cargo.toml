[package]
name = "glorp"
version = "0.2.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "glorp"
path = "src/main.rs"

[features]
# `dev-preview` enables the hidden `glorp dev-preview` design-review command.
# Default-on for local development; npm release builds pass
# `--no-default-features` to strip it from the published binary.
default = ["dev-preview"]
dev-preview = []

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tachyonfx = "0.18"
taffy = { version = "0.10.1", default-features = false, features = ["std", "taffy_tree", "flexbox"] }
terminal-light = "1"
thiserror = "1"
tempfile = "3"
rand = { version = "0.8", default-features = false, features = ["std_rng"] }
rand_pcg = "0.3"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "local-offset", "macros"] }
toml = "0.8"
wait-timeout = "0.2"
which = "7"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = [
    "NSAttributedString",
    "NSDictionary",
    "NSGeometry",
    "NSRange",
    "NSRunLoop",
    "NSString",
    "NSThread",
    "NSTimer",
    "NSValue",
] }
objc2-app-kit = { version = "0.2", features = [
    "NSAppearance",
    "NSApplication",
    "NSAttributedString",
    "NSButton",
    "NSColor",
    "NSControl",
    "NSFont",
    "NSFontDescriptor",
    "NSGraphics",
    "NSImage",
    "NSParagraphStyle",
    "NSPopover",
    "NSResponder",
    "NSRunningApplication",
    "NSScrollView",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSText",
    "NSTextContainer",
    "NSTextStorage",
    "NSTextView",
    "NSView",
    "NSViewController",
    "NSWindow",
] }

[dev-dependencies]
assert_cmd = "2"
insta = { version = "1", features = ["yaml"] }
predicates = "3"
proptest = "1"
