[package]
name = "glorp"
version = "0.1.6"
edition = "2021"
license = "MIT"

[[bin]]
name = "glorp"
path = "src/main.rs"

[features]
# `dev-preview` enables the hidden `glorp dev-preview` design-review command.
# Default-on for local development; npm release builds pass
# `--no-default-features` to strip it from the published binary.
default = ["dev-preview"]
dev-preview = []

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tachyonfx = "0.18"
terminal-light = "1"
thiserror = "1"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "local-offset", "macros"] }
toml = "0.8"
which = "7"

[dev-dependencies]
assert_cmd = "2"
insta = { version = "1", features = ["yaml"] }
predicates = "3"
tempfile = "3"
