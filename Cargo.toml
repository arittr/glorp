[package]
name = "glorp"
version = "0.13.0"
edition = "2021"
license = "MIT"

[workspace]
members = [".", "xtask"]
default-members = ["."]

[[bin]]
name = "glorp"
path = "src/main.rs"

[features]
# `dev-preview` enables the hidden `glorp dev-preview` design-review command.
# Default-on for local development; npm release builds pass
# `--no-default-features` to strip it from the published binary.
default = ["dev-preview"]
dev-preview = []
retained-renderer = [
    "dep:bytemuck",
    "dep:objc2-quartz-core",
    "dep:png",
    "dep:pollster",
    "dep:sha2",
    "dep:wgpu",
    "objc2-app-kit/objc2-quartz-core",
]
renderer-spike = ["dep:png", "dep:sha2"]
renderer-spike-wgpu = [
    "renderer-spike",
    "dep:bytemuck",
    "dep:objc2-quartz-core",
    "dep:pollster",
    "dep:wgpu",
    "objc2-app-kit/objc2-quartz-core",
]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tachyonfx = "0.18"
taffy = { version = "0.10.1", default-features = false, features = ["std", "taffy_tree", "flexbox"] }
terminal-light = "1"
thiserror = "1"
tempfile = "3"
rand = { version = "0.8", default-features = false, features = ["std_rng"] }
rand_pcg = "0.3"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "local-offset", "macros"] }
toml = "0.8"
unicode-width = "0.2"
wait-timeout = "0.2"
which = "7"
sha2 = { version = "0.10", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.5"
objc2 = { version = "0.5", features = ["catch-all"] }
objc2-quartz-core = { version = "0.2.2", optional = true, default-features = false, features = [
    "CALayer",
    "CAMetalLayer",
] }
objc2-foundation = { version = "0.2", features = [
    "block2",
    "NSData",
    "NSAttributedString",
    "NSDictionary",
    "NSGeometry",
    "NSRange",
    "NSRunLoop",
    "NSString",
    "NSThread",
    "NSTimer",
    "NSUserDefaults",
    "NSValue",
] }
objc2-app-kit = { version = "0.2", features = [
    "NSAccessibility",
    "NSAccessibilityConstants",
    "NSAccessibilityElement",
    "NSAccessibilityProtocols",
    "NSAppearance",
    "NSApplication",
    "NSAttributedString",
    "NSBitmapImageRep",
    "NSBezierPath",
    "NSButton",
    "NSColor",
    "NSColorSpace",
    "NSControl",
    "NSFont",
    "NSFontDescriptor",
    "NSGradient",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSMenu",
    "NSMenuItem",
    "NSParagraphStyle",
    "NSPopover",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSScrollView",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSStringDrawing",
    "NSText",
    "NSTextContainer",
    "NSTextStorage",
    "NSTextView",
    "NSView",
    "NSViewController",
    "NSWindow",
    "NSEvent",
] }
bytemuck = { version = "1.25.1", optional = true, features = ["derive"] }
png = { version = "0.18.1", optional = true }
pollster = { version = "1.0.0", optional = true }
wgpu = { version = "=30.0.0", optional = true, default-features = false, features = [
    "metal",
    "std",
    "wgsl",
] }

[dev-dependencies]
assert_cmd = "2"
insta = { version = "1", features = ["yaml"] }
predicates = "3"
proptest = "1"
