name: publish

# Publishes glorp + its five platform subpackages to npm on a v* tag.
# Uses npm Trusted Publishers (OIDC) — no NPM_TOKEN secret required.
#
# One-time setup on npmjs.com (per package, all six):
#   Account → Trusted Publishers → Add
#     Publisher: GitHub Actions
#     Repo: arittr/glorp
#     Workflow filename: publish.yml
#     Environment (optional): leave blank, or "release"
#
# After tagging:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Publish order is enforced by job dependencies:
#   build → publish-platforms → publish-main
# so the main package's optionalDependencies resolve at install time.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build but skip publish (matrix smoke test)'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write   # required for npm OIDC trusted publishing

jobs:
  test:
    name: rust test (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-test-${{ matrix.os }}
      - name: cargo fmt --check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: cargo clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --locked

  build:
    name: build ${{ matrix.target }}
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          # Apple Silicon ships the retained renderer backend.
          - target: darwin-arm64
            runner: macos-latest
            rust_target: aarch64-apple-darwin
            cargo_features: --no-default-features --features retained-renderer
          # Cross-compile darwin-x64 from Apple Silicon — hosted Intel mac
          # runners (macos-13) get throttled hard and can queue indefinitely.
          # `--target x86_64-apple-darwin` from arm64 needs no extra tooling.
          # Intel is Smooth-only: no retained-renderer.
          - target: darwin-x64
            runner: macos-latest
            rust_target: x86_64-apple-darwin
            cargo_features: --no-default-features
          - target: linux-x64
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            cargo_features: --no-default-features
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            cargo_features: --no-default-features
          - target: win32-x64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            cargo_features: --no-default-features
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
      - name: cargo build --release
        # --no-default-features strips the hidden dev-preview command so it does
        # not ship in the published npm binaries. Apple Silicon additionally
        # compiles `--features retained-renderer`; every other target stays
        # Smooth-only. See matrix.cargo_features.
        run: cargo build --release --locked ${{ matrix.cargo_features }} --target ${{ matrix.rust_target }}
      - name: build companion app bundle
        if: startsWith(matrix.target, 'darwin-')
        run: node scripts/build-macos-companion-app.mjs --binary "target/${{ matrix.rust_target }}/release/glorp"
      - name: staged direct route proof (Apple Silicon)
        # Run the exact executable staged inside Glorp.app on the native logged-in
        # host. Auto remains on the legacy scene route while the Gate D rollback
        # is active; explicit Live proves and captures the direct route before
        # upload without claiming the failed hold passed.
        if: matrix.target == 'darwin-arm64'
        shell: bash
        timeout-minutes: 2
        run: |
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"
          console_user="$(stat -f '%Su' /dev/console)"
          test -n "$console_user"
          test "$console_user" != "root"
          test "$console_user" != "loginwindow"
          test "$(id -un)" = "$console_user"

          app_bin="target/macos/Glorp.app/Contents/MacOS/glorp"
          test -x "$app_bin"
          auto="$("$app_bin" companion-app --print-capabilities)"
          echo "$auto"
          echo "$auto" | grep -qx "requested-renderer=auto"
          echo "$auto" | grep -qx "retained-compiled=true"
          echo "$auto" | grep -qx "auto-retained-on-apple-silicon=true"
          echo "$auto" | grep -qx "effective-renderer=retained"
          echo "$auto" | grep -qx "effective-scene-route=legacy"

          direct="$("$app_bin" companion-app --renderer retained --retained-scene-runtime live --print-capabilities)"
          echo "$direct"
          echo "$direct" | grep -qx "requested-renderer=retained"
          echo "$direct" | grep -qx "effective-renderer=retained"
          echo "$direct" | grep -qx "effective-scene-route=direct"

          proof_root="target/package-route-proof"
          capture_dir="$proof_root/direct"
          capture_path="$capture_dir/scene.png"
          config_dir="$proof_root/config"
          rm -rf "$proof_root"
          mkdir -p "$config_dir"
          GLORP_CONFIG_DIR="$config_dir" "$app_bin" init \
            --seed package-route-proof-v1 --name PackageProof --yes
          GLORP_CONFIG_DIR="$config_dir" "$app_bin" companion-app \
            --renderer retained \
            --retained-scene-runtime live \
            --review-size 360x360 \
            --review-duration-ms 2000 \
            --review-capture-dir "$capture_dir"
          test -f "$capture_path"
          for artifact in scene-manifest.json scene-snapshot.json scene-version.json scene-metrics.json scene-artifacts.json; do
            test -s "$capture_dir/$artifact"
          done
          grep -q '"route": "direct-retained-scene"' "$capture_dir/scene-manifest.json"
          grep -q '"effective_renderer": "retained"' "$capture_dir/scene-manifest.json"
          grep -q '"nonblank_validation": "valid"' "$capture_dir/scene-manifest.json"

          CAPTURE_PATH="$capture_path" swift - <<'SWIFT'
          import CoreGraphics
          import Foundation
          import ImageIO

          let path = ProcessInfo.processInfo.environment["CAPTURE_PATH"]!
          let url = URL(fileURLWithPath: path) as CFURL
          guard let source = CGImageSourceCreateWithURL(url, nil),
                let image = CGImageSourceCreateImageAtIndex(source, 0, nil),
                image.width > 0, image.height > 0 else {
              fputs("invalid direct capture at \(path)\n", stderr)
              exit(1)
          }
          var rgba = [UInt8](repeating: 0, count: image.width * image.height * 4)
          let drew = rgba.withUnsafeMutableBytes { bytes in
              CGContext(
                  data: bytes.baseAddress,
                  width: image.width,
                  height: image.height,
                  bitsPerComponent: 8,
                  bytesPerRow: image.width * 4,
                  space: CGColorSpaceCreateDeviceRGB(),
                  bitmapInfo: CGImageAlphaInfo.premultipliedLast.rawValue
              )
          }
          guard let context = drew else {
              fputs("cannot decode direct capture at \(path)\n", stderr)
              exit(1)
          }
          context.draw(image, in: CGRect(x: 0, y: 0, width: image.width, height: image.height))
          var colors = Set<UInt32>()
          var visibleNonblack = false
          for index in stride(from: 0, to: rgba.count, by: 4) {
              let pixel = (UInt32(rgba[index]) << 24)
                  | (UInt32(rgba[index + 1]) << 16)
                  | (UInt32(rgba[index + 2]) << 8)
                  | UInt32(rgba[index + 3])
              colors.insert(pixel)
              visibleNonblack = visibleNonblack ||
                  (rgba[index + 3] != 0 && (rgba[index] != 0 || rgba[index + 1] != 0 || rgba[index + 2] != 0))
          }
          guard visibleNonblack, colors.count > 1 else {
              fputs("blank direct capture at exact path \(path)\n", stderr)
              exit(1)
          }
          print("validated nonblank direct capture: \(path) (\(image.width)x\(image.height), \(colors.count) colors)")
          SWIFT
      - name: staged smooth-only smoke (Intel)
        # The Intel artifact ships without the retained backend: Auto stays
        # Smooth even with the cutover constant on, and explicit Retained is
        # rejected outright. Rosetta lets the arm64 runner execute the
        # cross-compiled x86_64 binary.
        if: matrix.target == 'darwin-x64'
        shell: bash
        run: |
          softwareupdate --install-rosetta --agree-to-license
          bin="target/${{ matrix.rust_target }}/release/glorp"
          auto="$("$bin" companion-app --print-capabilities)"
          echo "$auto"
          echo "$auto" | grep -qx "requested-renderer=auto"
          echo "$auto" | grep -qx "retained-compiled=false"
          echo "$auto" | grep -qx "auto-retained-on-apple-silicon=true"
          echo "$auto" | grep -qx "effective-renderer=smooth"
          if "$bin" companion-app --renderer retained --print-capabilities; then
            echo "explicit retained must be rejected on the Intel build" >&2
            exit 1
          fi
      - name: stage binary at workspace root for upload
        # Upload-artifact preserves paths relative to the workspace, and the
        # publish-platforms job downloads into `target/release/`. Copy the
        # built binary to the workspace root so the artifact stays flat and
        # the download lands at `target/release/glorp` (or .exe).
        shell: bash
        run: |
          if [ -f "target/${{ matrix.rust_target }}/release/glorp" ]; then
            cp "target/${{ matrix.rust_target }}/release/glorp" ./glorp
          fi
          if [ -f "target/${{ matrix.rust_target }}/release/glorp.exe" ]; then
            cp "target/${{ matrix.rust_target }}/release/glorp.exe" ./glorp.exe
          fi
      - name: upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: glorp-${{ matrix.target }}
          path: |
            glorp
            glorp.exe
          if-no-files-found: error
      - name: stage companion app artifact
        if: startsWith(matrix.target, 'darwin-')
        shell: bash
        run: tar -czf "glorp-app-${{ matrix.target }}.tgz" -C target/macos Glorp.app
      - name: upload companion app artifact
        if: startsWith(matrix.target, 'darwin-')
        uses: actions/upload-artifact@v4
        with:
          name: glorp-app-${{ matrix.target }}
          path: glorp-app-${{ matrix.target }}.tgz
          if-no-files-found: error

  smoke:
    name: smoke test (launcher)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: release version script tests
        run: npm run test:release-version
      - name: assert release versions
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            node scripts/assert-release-version.mjs --tag "$GITHUB_REF_NAME"
          else
            node scripts/assert-release-version.mjs
          fi
      - name: install npm package deps (ccusage helpers)
        # Run at the workspace root, not inside npm/glorp — npm 11's
        # workspace resolver chokes when invoked from a workspace child
        # whose package has unresolvable optionalDependencies.
        run: npm install --no-audit --no-fund
      - name: launcher smoke test
        working-directory: npm/glorp
        run: node test/smoke.mjs

  publish-platforms:
    name: publish platform packages
    needs: [build, smoke]
    if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      # Sequential so a transient npm registry hiccup doesn't half-publish.
      max-parallel: 1
      matrix:
        target: [darwin-arm64, darwin-x64, linux-x64, linux-arm64, win32-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          # No registry-url — that writes an .npmrc that expects
          # NODE_AUTH_TOKEN. We use OIDC trusted publishing, so npm
          # exchanges the workflow's id-token for a publish token
          # automatically. Setting registry-url leaves an empty auth
          # token in .npmrc, which short-circuits OIDC and gets 404'd.
      - name: assert release versions match tag
        run: node scripts/assert-release-version.mjs --tag "$GITHUB_REF_NAME"
      - name: download platform binary
        uses: actions/download-artifact@v4
        with:
          name: glorp-${{ matrix.target }}
          path: target/release/
      - name: download companion app artifact
        if: startsWith(matrix.target, 'darwin-')
        uses: actions/download-artifact@v4
        with:
          name: glorp-app-${{ matrix.target }}
          path: target/macos/
      - name: unpack companion app artifact
        if: startsWith(matrix.target, 'darwin-')
        shell: bash
        run: tar -xzf "target/macos/glorp-app-${{ matrix.target }}.tgz" -C target/macos
      - name: stage binary into platform package
        run: |
          chmod +x target/release/glorp 2>/dev/null || true
          node scripts/build-platform-package.mjs --platform ${{ matrix.target }}
      - name: npm publish (platform)
        working-directory: npm/platform/${{ matrix.target }}
        run: npm publish --provenance --access public

  publish-main:
    name: publish glorp
    needs: publish-platforms
    if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          # No registry-url — that writes an .npmrc that expects
          # NODE_AUTH_TOKEN. We use OIDC trusted publishing, so npm
          # exchanges the workflow's id-token for a publish token
          # automatically. Setting registry-url leaves an empty auth
          # token in .npmrc, which short-circuits OIDC and gets 404'd.
      - name: assert release versions match tag
        run: node scripts/assert-release-version.mjs --tag "$GITHUB_REF_NAME"
      - name: npm publish (main)
        working-directory: npm/glorp
        run: npm publish --provenance --access public
