name: publish

# Publishes glorp + its five platform subpackages to npm on a v* tag.
# Uses npm Trusted Publishers (OIDC) — no NPM_TOKEN secret required.
#
# One-time setup on npmjs.com (per package, all six):
#   Account → Trusted Publishers → Add
#     Publisher: GitHub Actions
#     Repo: arittr/glorp
#     Workflow filename: publish.yml
#     Environment (optional): leave blank, or "release"
#
# After tagging:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Publish order is enforced by job dependencies:
#   build → publish-platforms → publish-main
# so the main package's optionalDependencies resolve at install time.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build but skip publish (matrix smoke test)'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write   # required for npm OIDC trusted publishing

jobs:
  test:
    name: rust test (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-test-${{ matrix.os }}
      - name: cargo fmt --check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: cargo clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --locked

  build:
    name: build ${{ matrix.target }}
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-latest
            rust_target: aarch64-apple-darwin
          # Cross-compile darwin-x64 from Apple Silicon — hosted Intel mac
          # runners (macos-13) get throttled hard and can queue indefinitely.
          # `--target x86_64-apple-darwin` from arm64 needs no extra tooling.
          - target: darwin-x64
            runner: macos-latest
            rust_target: x86_64-apple-darwin
          - target: linux-x64
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
          - target: win32-x64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
      - name: cargo build --release
        run: cargo build --release --locked --target ${{ matrix.rust_target }}
      - name: stage binary at workspace root for upload
        # Upload-artifact preserves paths relative to the workspace, and the
        # publish-platforms job downloads into `target/release/`. Copy the
        # built binary to the workspace root so the artifact stays flat and
        # the download lands at `target/release/glorp` (or .exe).
        shell: bash
        run: |
          if [ -f "target/${{ matrix.rust_target }}/release/glorp" ]; then
            cp "target/${{ matrix.rust_target }}/release/glorp" ./glorp
          fi
          if [ -f "target/${{ matrix.rust_target }}/release/glorp.exe" ]; then
            cp "target/${{ matrix.rust_target }}/release/glorp.exe" ./glorp.exe
          fi
      - name: upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: glorp-${{ matrix.target }}
          path: |
            glorp
            glorp.exe
          if-no-files-found: error

  smoke:
    name: smoke test (launcher)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: install npm package deps (ccusage helpers)
        # Run at the workspace root, not inside npm/glorp — npm 11's
        # workspace resolver chokes when invoked from a workspace child
        # whose package has unresolvable optionalDependencies.
        run: npm install --no-audit --no-fund
      - name: launcher smoke test
        working-directory: npm/glorp
        run: node test/smoke.mjs

  publish-platforms:
    name: publish platform packages
    needs: [build, smoke]
    if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      # Sequential so a transient npm registry hiccup doesn't half-publish.
      max-parallel: 1
      matrix:
        target: [darwin-arm64, darwin-x64, linux-x64, linux-arm64, win32-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          # No registry-url — that writes an .npmrc that expects
          # NODE_AUTH_TOKEN. We use OIDC trusted publishing, so npm
          # exchanges the workflow's id-token for a publish token
          # automatically. Setting registry-url leaves an empty auth
          # token in .npmrc, which short-circuits OIDC and gets 404'd.
      - name: download platform binary
        uses: actions/download-artifact@v4
        with:
          name: glorp-${{ matrix.target }}
          path: target/release/
      - name: stage binary into platform package
        run: |
          chmod +x target/release/glorp 2>/dev/null || true
          node scripts/build-platform-package.mjs --platform ${{ matrix.target }}
      - name: assert package version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./npm/platform/${{ matrix.target }}/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::@glorp/${{ matrix.target }} version $PKG_VERSION does not match tag $TAG_VERSION"
            exit 1
          fi
      - name: npm publish (platform)
        working-directory: npm/platform/${{ matrix.target }}
        run: npm publish --provenance --access public

  publish-main:
    name: publish glorp
    needs: publish-platforms
    if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          # No registry-url — that writes an .npmrc that expects
          # NODE_AUTH_TOKEN. We use OIDC trusted publishing, so npm
          # exchanges the workflow's id-token for a publish token
          # automatically. Setting registry-url leaves an empty auth
          # token in .npmrc, which short-circuits OIDC and gets 404'd.
      - name: assert main package version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./npm/glorp/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::glorp version $PKG_VERSION does not match tag $TAG_VERSION"
            exit 1
          fi
      - name: npm publish (main)
        working-directory: npm/glorp
        run: npm publish --provenance --access public
