name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.os }}
      - name: cargo fmt --check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: cargo clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --locked
      - name: cargo check --no-default-features
        # Mirror the release build's feature set so a missing
        # `#[cfg(feature = "dev-preview")]` guard fails CI, not the
        # publish workflow.
        if: matrix.os == 'ubuntu-latest'
        run: cargo check --locked --no-default-features --all-targets
      - name: cargo clippy (retained renderer)
        # Natively lint the Apple-Silicon release config
        # (`--no-default-features --features retained-renderer`) so its
        # feature-gated code stays clippy-clean before the publish workflow
        # builds it.
        if: matrix.os == 'macos-latest'
        run: cargo clippy --locked --no-default-features --features retained-renderer -- -D warnings
      - name: cargo test (retained renderer)
        # Library unit tests only: the shipped arm64 config strips `dev-preview`,
        # so the integration tests that shell out to the hidden `dev-preview`
        # subcommand cannot run here. They stay covered by the default-feature
        # `cargo test` above.
        if: matrix.os == 'macos-latest'
        run: cargo test --locked --lib --no-default-features --features retained-renderer

  npm-smoke:
    name: npm launcher smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: release version script tests
        run: npm run test:release-version
      - name: install npm package deps (ccusage helpers)
        # Run at the workspace root, not inside npm/glorp — npm 11's
        # workspace resolver chokes when invoked from a workspace child
        # whose package has unresolvable optionalDependencies.
        run: npm install --no-audit --no-fund
      - name: launcher smoke test
        working-directory: npm/glorp
        run: node test/smoke.mjs
