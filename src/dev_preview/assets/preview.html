<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glorp Preview</title>
  <link rel="stylesheet" href="assets/preview.css">
  <script defer src="assets/preview.js"></script>
</head>
<body>
  <main class="preview-page">
    <header class="preview-header">
      <h1>Glorp Preview</h1>
      <p>Generated {{GENERATED_AT}}</p>
      <div class="preview-controls" aria-label="Layout overlays">
        <button type="button" data-overlay-toggle="components" aria-pressed="false">Components</button>
        <button type="button" data-overlay-toggle="targets" aria-pressed="false">Targets</button>
      </div>
    </header>
    <section class="preview-frames">
      {{FRAMES}}
    </section>
  </main>
</body>
</html>
