pre-commit:
  parallel: true
  jobs:
    - name: fmt
      glob: "*.rs"
      run: cargo fmt --all -- --check
      stage_fixed: false
    - name: clippy
      glob: "*.{rs,toml}"
      run: cargo clippy --lib --bins --features retained-renderer -- -D warnings

pre-push:
  jobs:
    - name: test
      run: cargo test --locked
    - name: clippy-full
      run: cargo clippy --all-targets --all-features -- -D warnings
